[package]
name = "json-escape-bench"
version = "0.1.0"
edition = "2021"
publish = false

# The original upstream crate (napi-rs/json-escape-simd), pulled from crates.io.
[dependencies]
json-escape-simd = "3.1.2"

[[bin]]
name = "json-escape-bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
