[package]
name = "json-escape-bench"
version = "0.1.0"
edition = "2021"
publish = false

# The Rust reference implementation is expected next to the Zig port.
# Override with a `[patch]` or by editing the path if it lives elsewhere.
[dependencies]
json-escape-simd = { path = "../../../json-escape-simd-x" }

[[bin]]
name = "json-escape-bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
